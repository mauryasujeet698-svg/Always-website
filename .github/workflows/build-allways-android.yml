# ALLways Android build workflow - stable Android project + PackageInstaller updater
name: Build ALLways Android APK

on:
  push:
    branches:
      - allways-android-app
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-allways-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bootstrap stable Android project if needed
        run: |
          cd mobile
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            mkdir -p /tmp/allways-bootstrap
            if [ -f android/app/google-services.json ]; then
              cp android/app/google-services.json /tmp/allways-bootstrap/google-services.json
            fi
            flutter create . --platforms=android --org com.allways.app
            if [ -f /tmp/allways-bootstrap/google-services.json ]; then
              mkdir -p android/app
              cp /tmp/allways-bootstrap/google-services.json android/app/google-services.json
            fi
          fi
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/google-services.json

      - name: Configure permanent ALLways Android package
        run: |
          cd mobile
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          target = "com.allways.app"
          root = Path("android/app/src/main")
          candidates = list((root / "kotlin").rglob("MainActivity.kt")) + list((root / "java").rglob("MainActivity.java"))
          if not candidates:
              raise SystemExit("MainActivity not found")
          src = candidates[0]
          text = src.read_text()
          text = re.sub(r'^package\s+[^\n]+', f'package {target}', text, count=1, flags=re.M)
          target_dir = root / "kotlin" / "com" / "allways" / "app"
          if src.suffix == ".java":
              target_dir = root / "java" / "com" / "allways" / "app"
          target_dir.mkdir(parents=True, exist_ok=True)
          dst = target_dir / src.name
          if src.suffix == ".kt":
              dst.write_text(text)
          else:
              dst.write_text(text)
          if src.resolve() != dst.resolve():
              src.unlink()

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          if groovy.exists():
              s=groovy.read_text()
              s=re.sub(r'namespace\s+[\'"][^\'"]+[\'"]', 'namespace "'+target+'"', s, count=1)
              s=re.sub(r'applicationId\s+[\'"][^\'"]+[\'"]', 'applicationId "'+target+'"', s, count=1)
              groovy.write_text(s)
          elif kotlin.exists():
              s=kotlin.read_text()
              s=re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "'+target+'"', s, count=1)
              s=re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "'+target+'"', s, count=1)
              kotlin.write_text(s)
          else:
              raise SystemExit("No app Gradle file")
          PY

      - name: Install stable native APK installer
        run: |
          cd mobile
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path("android/app/src/main/kotlin/com/allways/app/MainActivity.kt")
          marker = "private val updaterChannel = \"com.allways.app/apk_installer\""
          s = p.read_text()

          if marker not in s:
              s = """package com.allways.app

import android.app.PendingIntent
import android.content.BroadcastReceiver
import android.content.Context
import android.content.Intent
import android.content.pm.PackageInstaller
import android.net.Uri
import android.os.Build
import android.provider.Settings
import androidx.annotation.NonNull
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel
import java.io.File
import java.io.FileInputStream

class MainActivity : FlutterActivity() {
    private val updaterChannel = "com.allways.app/apk_installer"
    private val installAction = "com.allways.app.PACKAGE_INSTALL_STATUS"

    override fun configureFlutterEngine(@NonNull flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, updaterChannel)
            .setMethodCallHandler { call, result ->
                when (call.method) {
                    "showNotification" -> {
                        result.success("shown")
                    }
                    "installApk" -> installApk(call.argument<String>("path"), result)
                    else -> result.notImplemented()
                }
            }
    }

    private fun installApk(path: String?, result: MethodChannel.Result) {
        if (path.isNullOrBlank()) {
            result.error("NO_APK", "APK path is missing", null)
            return
        }

        try {
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                !packageManager.canRequestPackageInstalls()) {
                startActivity(
                    Intent(
                        Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                        Uri.parse("package:$packageName")
                    )
                )
                result.success("permission_required")
                return
            }

            val apk = File(path)
            if (!apk.exists() || !apk.isFile || !apk.canRead() || apk.length() <= 0L) {
                result.error("NO_APK", "Downloaded APK is missing or unreadable", null)
                return
            }

            val installer = packageManager.packageInstaller
            val params = PackageInstaller.SessionParams(
                PackageInstaller.SessionParams.MODE_FULL_INSTALL
            )
            params.setAppPackageName(packageName)
            params.setAppLabel("ALLways")

            val sessionId = installer.createSession(params)
            val session = installer.openSession(sessionId)

            try {
                session.openWrite("package", 0, apk.length()).use { output ->
                    FileInputStream(apk).use { input ->
                        input.copyTo(output, 1024 * 1024)
                    }
                    session.fsync(output)
                }

                val statusIntent = Intent(this, InstallStatusReceiver::class.java).apply {
                    action = installAction
                    putExtra("sessionId", sessionId)
                }

                val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE
                } else {
                    PendingIntent.FLAG_UPDATE_CURRENT
                }

                val pending = PendingIntent.getBroadcast(
                    this,
                    sessionId,
                    statusIntent,
                    flags
                )

                session.commit(pending.intentSender)
                result.success("started")
            } catch (e: Exception) {
                try { session.abandon() } catch (_: Exception) {}
                throw e
            } finally {
                try { session.close() } catch (_: Exception) {}
            }
        } catch (e: Exception) {
            result.error("INSTALL_FAILED", e.message ?: "Package installation failed", null)
        }
    }

    class InstallStatusReceiver : BroadcastReceiver() {
        override fun onReceive(context: Context, intent: Intent) {
            val status = intent.getIntExtra(
                PackageInstaller.EXTRA_STATUS,
                PackageInstaller.STATUS_FAILURE
            )
            if (status == PackageInstaller.STATUS_PENDING_USER_ACTION) {
                val confirmIntent =
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                        intent.getParcelableExtra(
                            Intent.EXTRA_INTENT,
                            Intent::class.java
                        )
                    } else {
                        @Suppress("DEPRECATION")
                        intent.getParcelableExtra(Intent.EXTRA_INTENT)
                    }
                if (confirmIntent != null) {
                    confirmIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                    context.startActivity(confirmIntent)
                }
            }
        }
    }
}
"""
              p.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ms = manifest.read_text()
          import re
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in ms:
              m = re.search(r"<manifest[^>]*>", ms)
              if not m: raise SystemExit("Manifest root missing")
              ms = ms[:m.end()] + '\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>' + ms[m.end():]
          if 'android:name=".MainActivity"' not in ms:
              app_close = "</application>"
              activity = """        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:launchMode="singleTop"
            android:theme="@style/LaunchTheme"
            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
            android:hardwareAccelerated="true"
            android:windowSoftInputMode="adjustResize">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
"""
              ms = ms.replace(app_close, activity + "    " + app_close, 1)
          if "com.allways.app.InstallStatusReceiver" not in ms and "MainActivity$InstallStatusReceiver" not in ms:
              receiver = """        <receiver
            android:name=".MainActivity$InstallStatusReceiver"
            android:exported="false" />
"""
              ms = ms.replace("</application>", receiver + "    </application>", 1)
          manifest.write_text(ms)

          paths = Path("android/app/src/main/res/xml/file_paths.xml")
          paths.parent.mkdir(parents=True, exist_ok=True)
          paths.write_text("""<?xml version="1.0" encoding="utf-8"?>
<paths xmlns:android="http://schemas.android.com/apk/res/android">
    <cache-path name="cache" path="." />
</paths>
""")
          PY

      - name: Configure Google Services
        run: |
          cd mobile
          python3 - <<'PY'
          from pathlib import Path
          import re

          sg=Path("android/settings.gradle")
          sk=Path("android/settings.gradle.kts")
          ag=Path("android/app/build.gradle")
          ak=Path("android/app/build.gradle.kts")

          if sg.exists():
              s=sg.read_text()
              if 'com.google.gms.google-services' not in s:
                  s=s.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services" version "4.5.0" apply false', 1)
              sg.write_text(s)
              if ag.exists():
                  a=ag.read_text()
                  if 'com.google.gms.google-services' not in a:
                      a=a.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services"', 1)
                      ag.write_text(a)
          elif sk.exists():
              s=sk.read_text()
              if 'com.google.gms.google-services' not in s:
                  s=s.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services") version "4.5.0" apply false', 1)
              sk.write_text(s)
              if ak.exists():
                  a=ak.read_text()
                  if 'com.google.gms.google-services' not in a:
                      a=a.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
                      ak.write_text(a)
          else:
              raise SystemExit("settings.gradle missing")
          PY

      - name: Configure permanent release signing
        env:
          ALLWAYS_KEYSTORE_BASE64: ${{ secrets.ALLWAYS_KEYSTORE_BASE64 }}
          ALLWAYS_KEYSTORE_PASSWORD: ${{ secrets.ALLWAYS_KEYSTORE_PASSWORD }}
          ALLWAYS_KEY_PASSWORD: ${{ secrets.ALLWAYS_KEY_PASSWORD }}
        run: |
          test -n "$ALLWAYS_KEYSTORE_BASE64"
          test -n "$ALLWAYS_KEYSTORE_PASSWORD"
          test -n "$ALLWAYS_KEY_PASSWORD"
          cd mobile
          mkdir -p android/keystore
          printf '%s' "$ALLWAYS_KEYSTORE_BASE64" | base64 --decode > android/keystore/allways-release.jks
          cat > android/key.properties <<EOF
storePassword=$ALLWAYS_KEYSTORE_PASSWORD
keyPassword=$ALLWAYS_KEY_PASSWORD
keyAlias=allways
storeFile=keystore/allways-release.jks
EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("Expected Groovy app/build.gradle")
          s=p.read_text()
          if "key.properties" not in s:
              s='''import java.util.Properties
import java.io.FileInputStream

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

'''+s
          if "signingConfigs {" not in s:
              s=s.replace("android {", """android {
    signingConfigs {
        release {
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storeFile keystoreProperties["storeFile"] ? rootProject.file(keystoreProperties["storeFile"]) : null
            storePassword keystoreProperties["storePassword"]
        }
    }""", 1)
          if "signingConfig signingConfigs.release" not in s:
              s=s.replace("buildTypes {", """buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
    buildTypes {""", 1)
          s=s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          p.write_text(s)
          PY

      - name: Validate permanent Android project before Gradle
        run: |
          cd mobile
          test -f android/app/google-services.json
          grep -q '"package_name": "com.allways.app"' android/app/google-services.json
          grep -q 'com.allways.app' android/app/build.gradle
          grep -q 'com.google.gms.google-services' android/settings.gradle
          grep -q 'applicationId "com.allways.app"' android/app/build.gradle
          grep -q 'namespace "com.allways.app"' android/app/build.gradle
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.MAIN' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'PackageInstaller.SessionParams' android/app/src/main/kotlin/com/allways/app/MainActivity.kt
          grep -q 'session.openWrite' android/app/src/main/kotlin/com/allways/app/MainActivity.kt
          grep -q 'session.commit' android/app/src/main/kotlin/com/allways/app/MainActivity.kt
          ! grep -q 'ACTION_INSTALL_PACKAGE' android/app/src/main/kotlin/com/allways/app/MainActivity.kt
          echo "Permanent Android project and PackageInstaller implementation validated."

      - name: Commit permanent Android project to branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/android
          if ! git diff --cached --quiet; then
            git commit -m "Stabilize permanent ALLways Android project"
            git push origin HEAD:allways-android-app
          fi

      - name: Prepare deterministic release asset
        run: |
          cd mobile
          mkdir -p assets
          truncate -s 2097152 assets/release_pad.bin

      - name: Get packages
        run: |
          cd mobile
          flutter pub get

      - name: Flutter analyze and tests
        run: |
          cd mobile
          rm -f test/widget_test.dart
          mkdir -p test
          cat > test/smoke_test.dart <<'EOF'
import 'package:flutter_test/flutter_test.dart';
void main() {
  test('ALLways test environment is working', () {
    expect(true, isTrue);
  });
}
EOF
          flutter analyze --no-fatal-infos
          flutter test
          cd ..
          node --check functions/index.js

      - name: Build release APK
        run: |
          cd mobile
          flutter build apk --release --no-shrink

      - name: Verify launcher and updater
        run: |
          cd mobile
          APKANALYZER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -x "$APKANALYZER"
          "$APKANALYZER" manifest print build/app/outputs/flutter-apk/app-release.apk > /tmp/allways-manifest.txt
          grep -q 'com.allways.app.MainActivity' /tmp/allways-manifest.txt
          grep -q 'android.intent.action.MAIN' /tmp/allways-manifest.txt
          grep -q 'android.intent.category.LAUNCHER' /tmp/allways-manifest.txt
          grep -q 'REQUEST_INSTALL_PACKAGES' /tmp/allways-manifest.txt
          echo "Launcher manifest verified."

      - name: Validate APK package and signature
        run: |
          cd mobile
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$CERT_OUTPUT"
          echo "$CERT_OUTPUT" | grep -qi 'SHA-1 digest: ee37c219b6d8b962665ec7753b4514b62b35601a'
          echo "Permanent signing certificate verified."

      - name: Verify Google Sign-In Web Client ID
        run: |
          cd mobile
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          gs=json.loads(Path("android/app/google-services.json").read_text())
          client=gs["client"][0]
          web=[x["client_id"] for x in client.get("oauth_client",[]) if x.get("client_type")==3]
          if web != ["869987297351-bonithsodhkkhb8a994d6hbiau8a3ltv.apps.googleusercontent.com"]:
              raise SystemExit("Unexpected allways-web Web OAuth client ID: "+repr(web))
          dart=Path("lib/main.dart").read_text()
          if "869987297351-bonithsodhkkhb8a994d6hbiau8a3ltv.apps.googleusercontent.com" not in dart:
              raise SystemExit("Dart serverClientId does not match Firebase web client")
          print("Google Sign-In serverClientId matches allways-web client_type 3.")
          PY

      - name: Prepare versioned APK asset
        run: |
          cd mobile
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/allways-v1.4.7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: allways-release-apk-v1.4.7
          path: mobile/build/app/outputs/flutter-apk/allways-v1.4.7.apk
          if-no-files-found: error

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view allways-latest >/dev/null 2>&1; then
            gh release create allways-latest --title "ALLways Latest APK" --notes "Latest ALLways Android build"
          fi
          gh release upload allways-latest mobile/build/app/outputs/flutter-apk/allways-v1.4.7.apk --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload allways-latest mobile/build/app/outputs/flutter-apk/app-release.apk --clobber --repo "$GITHUB_REPOSITORY"
