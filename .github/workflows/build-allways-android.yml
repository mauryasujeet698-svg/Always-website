# ALLways Android build workflow - signing verification
name: Build ALLways Android APK

on:
  push:
    branches:
      - allways-android-app
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-allways-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android project
        run: |
          cd mobile
          if [ -f android/app/google-services.json ]; then cp android/app/google-services.json /tmp/google-services.json; fi
          rm -rf android
          flutter create . --platforms=android --org com.allways.app
          if [ -f /tmp/google-services.json ]; then mkdir -p android/app; cp /tmp/google-services.json android/app/google-services.json; fi

          # flutter create generates MainActivity under the org + project-name
          # package (com.allways.app.allways_app). Firebase/Google OAuth is
          # registered for the exact Android package com.allways.app, so align
          # the generated activity package and path too. Otherwise the APK can
          # install successfully but Android cannot launch MainActivity.
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          target = "com.allways.app"
          root = Path("android/app/src/main")
          candidates = list((root / "kotlin").rglob("MainActivity.kt")) + list((root / "java").rglob("MainActivity.java"))
          if not candidates:
              raise SystemExit("Generated MainActivity was not found")
          src = candidates[0]
          text = src.read_text()
          text = re.sub(r'^package\\s+[^\\n]+', f'package {target}', text, count=1, flags=re.M)
          target_dir = root / "kotlin" / "com" / "allways" / "app"
          if src.suffix == ".java":
              target_dir = root / "java" / "com" / "allways" / "app"
          target_dir.mkdir(parents=True, exist_ok=True)
          dst = target_dir / src.name
          dst.write_text(text)
          if src.resolve() != dst.resolve():
              src.unlink()
          PY

      - name: Configure in-app APK updater
        run: |
          cd mobile
          python3 - <<'PY'
          from pathlib import Path

          candidates = list(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"))
          if not candidates:
              raise SystemExit("MainActivity.kt not found")
          p = candidates[0]
          s = p.read_text()
          if "apk_installer" not in s:
              s = s.replace("import io.flutter.embedding.android.FlutterActivity", "import android.app.NotificationChannel\nimport android.app.NotificationManager\nimport android.content.ClipData\nimport android.content.Intent\nimport android.net.Uri\nimport android.os.Build\nimport android.provider.Settings\nimport androidx.core.app.NotificationCompat\nimport androidx.core.content.FileProvider\nimport io.flutter.embedding.android.FlutterActivity\nimport io.flutter.plugin.common.MethodChannel\nimport java.io.File")
              s = s.replace(
                  "class MainActivity : FlutterActivity()",
                  """class MainActivity : FlutterActivity() {
              private val updaterChannel = "com.allways.app/apk_installer"

              override fun configureFlutterEngine(flutterEngine: io.flutter.embedding.engine.FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, updaterChannel).setMethodCallHandler { call, result ->
                      if (call.method == "showNotification") {
                          val title = call.argument<String>("title") ?: "ALLways"
                          val body = call.argument<String>("body") ?: "New ALLways update"
                          val channelId = "allways_alerts"
                          val nm = getSystemService(NotificationManager::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              nm.createNotificationChannel(NotificationChannel(channelId, "ALLways alerts", NotificationManager.IMPORTANCE_HIGH))
                          }
                          val notification = NotificationCompat.Builder(this, channelId)
                              .setSmallIcon(com.allways.app.R.drawable.ic_allways)
                              .setContentTitle(title)
                              .setContentText(body)
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setAutoCancel(true)
                              .build()
                          nm.notify((System.currentTimeMillis() % Int.MAX_VALUE).toInt(), notification)
                          result.success("shown")
                          return@setMethodCallHandler
                      }
                      if (call.method != "installApk") {
                          result.notImplemented()
                          return@setMethodCallHandler
                      }
                      val path = call.argument<String>("path")
                      if (path.isNullOrBlank()) {
                          result.error("NO_APK", "APK path is missing", null)
                          return@setMethodCallHandler
                      }
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !packageManager.canRequestPackageInstalls()) {
                              startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + packageName)))
                              result.success("permission_required")
                              return@setMethodCallHandler
                          }
                          val apk = File(path)
                          if (!apk.exists() || !apk.isFile || !apk.canRead()) {
                              result.error("NO_APK", "Downloaded APK is missing or unreadable", null)
                              return@setMethodCallHandler
                          }
                          val uri = FileProvider.getUriForFile(this, packageName + ".fileprovider", apk)
                          val intent = Intent(Intent.ACTION_INSTALL_PACKAGE).apply {
                              setDataAndType(uri, "application/vnd.android.package-archive")
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              clipData = ClipData.newRawUri("ALLways APK", uri)
                          }
                          if (intent.resolveActivity(packageManager) == null) {
                              result.error("NO_INSTALLER", "Android package installer is unavailable", null)
                              return@setMethodCallHandler
                          }
                          startActivity(intent)
                          result.success("started")
                      } catch (e: Exception) {
                          result.error("INSTALL_FAILED", e.message, null)
                      }
                  }
              }
          }"""
              )
              p.write_text(s)
          PY

          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
          </paths>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in s:
              import re\n              s=re.sub(r"<application\\b", "<uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\"/>\\n    <application", s, count=1)
          if "androidx.core.content.FileProvider" not in s:
              provider='''\n        <provider
              android:name="androidx.core.content.FileProvider"
              android:authorities="${applicationId}.fileprovider"
              android:exported="false"
              android:grantUriPermissions="true">
              <meta-data
                  android:name="android.support.FILE_PROVIDER_PATHS"
                  android:resource="@xml/file_paths" />
          </provider>'''
              s=s.replace("</application>", provider+"\n    </application>", 1)
          p.write_text(s)
          PY

      - name: Verify in-app updater installer bridge
        run: |
          cd mobile
          python3 - <<'PY'
          from pathlib import Path
          main = next(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"), None)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          paths = Path("android/app/src/main/res/xml/file_paths.xml")
          if main is None:
              raise SystemExit("FAIL: MainActivity.kt was not generated")
          ms = main.read_text()
          xs = manifest.read_text()
          required_main = [
              "import android.content.ClipData",
              "Intent.ACTION_INSTALL_PACKAGE",
              "FileProvider.getUriForFile",
              "ClipData.newRawUri",
              "Intent.FLAG_GRANT_READ_URI_PERMISSION",
              "packageManager.canRequestPackageInstalls()",
          ]
          required_manifest = [
              "android.permission.REQUEST_INSTALL_PACKAGES",
              "androidx.core.content.FileProvider",
              'android:grantUriPermissions="true"',
              '@xml/file_paths',
          ]
          missing = [x for x in required_main if x not in ms] + [x for x in required_manifest if x not in xs]
          if not paths.exists() or "<cache-path" not in paths.read_text():
              missing.append("cache FileProvider path")
          if missing:
              raise SystemExit("FAIL: updater bridge missing: " + ", ".join(missing))
          print("PASS: native ALLways APK installer bridge is present and wired.")
          PY

      - name: Configure ALLways Android package and Firebase Google Services
        run: |
          cd mobile
          python3 - <<'PY'
          from pathlib import Path
          import re

          target_package = "com.allways.app"

          # flutter create --org com.allways.app would otherwise produce
          # com.allways.app.allways_app. ALLways is already registered in
          # Firebase/Google OAuth as com.allways.app, so force the exact ID.
          app = Path("android/app")
          groovy = app / "build.gradle"
          kotlin = app / "build.gradle.kts"
          settings_groovy = Path("android/settings.gradle")
          settings_kotlin = Path("android/settings.gradle.kts")

          if groovy.exists():
              p = groovy
              s = p.read_text()
              s = re.sub(r"namespace\s+['\"][^'\"]+['\"]", 'namespace "' + target_package + '"', s, count=1)
              s = re.sub(r"applicationId\s+['\"][^'\"]+['\"]", 'applicationId "' + target_package + '"', s, count=1)
              p.write_text(s)
          elif kotlin.exists():
              p = kotlin
              s = p.read_text()
              s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "' + target_package + '"', s, count=1)
              s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "' + target_package + '"', s, count=1)
              p.write_text(s)
          else:
              raise SystemExit("No Android app Gradle file found")

          # Apply the official Google Services Gradle plugin so the checked-in
          # google-services.json is actually processed during the build.
          if settings_groovy.exists():
              p = settings_groovy
              s = p.read_text()
              if 'com.google.gms.google-services' not in s:
                  marker = 'plugins {'
                  s = s.replace(marker, marker + '\n    id "com.google.gms.google-services" version "4.5.0" apply false', 1)
              p.write_text(s)
              app_text = groovy.read_text() if groovy.exists() else ""
              if 'com.google.gms.google-services' not in app_text:
                  app_text = app_text.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services"', 1)
                  groovy.write_text(app_text)
          elif settings_kotlin.exists():
              p = settings_kotlin
              s = p.read_text()
              if 'com.google.gms.google-services' not in s:
                  marker = 'plugins {'
                  s = s.replace(marker, marker + '\n    id("com.google.gms.google-services") version "4.5.0" apply false', 1)
              p.write_text(s)
              app_text = kotlin.read_text() if kotlin.exists() else ""
              if 'com.google.gms.google-services' not in app_text:
                  app_text = app_text.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
                  kotlin.write_text(app_text)
          else:
              raise SystemExit("No Android settings Gradle file found")
          PY

          grep -R -n 'applicationId.*com.allways.app' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true

      - name: Verify Firebase configuration
        run: |
          cd mobile
          test -f android/app/google-services.json
          grep -q '"client_type": 1' android/app/google-services.json
          grep -q '"package_name": "com.allways.app"' android/app/google-services.json
          grep -q 'com.allways.app' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null
          grep -q 'com.google.gms.google-services' android/settings.gradle android/settings.gradle.kts 2>/dev/null

      - name: Configure permanent ALLways release signing
        env:
          ALLWAYS_KEYSTORE_BASE64: ${{ secrets.ALLWAYS_KEYSTORE_BASE64 }}
          ALLWAYS_KEYSTORE_PASSWORD: ${{ secrets.ALLWAYS_KEYSTORE_PASSWORD }}
          ALLWAYS_KEY_PASSWORD: ${{ secrets.ALLWAYS_KEY_PASSWORD }}
        run: |
          test -n "$ALLWAYS_KEYSTORE_BASE64"
          test -n "$ALLWAYS_KEYSTORE_PASSWORD"
          test -n "$ALLWAYS_KEY_PASSWORD"
          cd mobile
          mkdir -p android/keystore
          printf '%s' "$ALLWAYS_KEYSTORE_BASE64" | base64 --decode > android/keystore/allways-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ALLWAYS_KEYSTORE_PASSWORD
          keyPassword=$ALLWAYS_KEY_PASSWORD
          keyAlias=allways
          storeFile=keystore/allways-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app")
          groovy = p / "build.gradle"
          kotlin = p / "build.gradle.kts"

          if groovy.exists():
              f = groovy
              s = f.read_text()
              if "key.properties" not in s:
                  prefix = '''import java.util.Properties
          import java.io.FileInputStream

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''
                  s = prefix + s
              if "signingConfigs {" not in s:
                  s = s.replace("android {", '''android {
              signingConfigs {
                  release {
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                      storeFile keystoreProperties["storeFile"] ? rootProject.file(keystoreProperties["storeFile"]) : null
                      storePassword keystoreProperties["storePassword"]
                  }
              }''', 1)
              s = s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              if "signingConfig signingConfigs.release" not in s:
                  s = s.replace("buildTypes {", '''buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
              buildTypes {''', 1)
              f.write_text(s)
          elif kotlin.exists():
              f = kotlin
              s = f.read_text()
              if "key.properties" not in s:
                  prefix = '''import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
                  s = prefix + s
              if 'create("release")' not in s:
                  s = s.replace("android {", '''android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = keystoreProperties["storeFile"]?.let { rootProject.file(it as String) }
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }''', 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              if 'signingConfig = signingConfigs.getByName("release")' not in s:
                  s = s.replace("buildTypes {", '''buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              buildTypes {''', 1)
              f.write_text(s)
          else:
              raise SystemExit("No Android app Gradle build file found")
          PY

      - name: Set ALLways app label and notification permission
        run: |
          cd mobile
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          import re
          s=re.sub(r'android:label="[^"]+"', 'android:label="ALLways"', s, count=1)
          # Keep REQUEST_INSTALL_PACKAGES so the Android package installer can be launched on Android 8+.
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in s:
              s=s.replace('<application ', '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application ', 1)
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s=s.replace('<application ', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application ', 1)
          if 'android.permission.ACCESS_FINE_LOCATION' not in s:
              s=s.replace('<application ', '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application ', 1)
          p.write_text(s)
          PY

      - name: Apply ALLways launcher icon
        run: |
          cd mobile
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_allways.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#000000" android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4"/>
            <path android:fillColor="#FFFFFF" android:pathData="M54,23 L28,82 L40,82 L46,68 L62,68 L68,82 L80,82 Z M54,42 L59,58 L49,58 Z"/>
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/ic_allways"')
          p.write_text(s)
          PY

      - name: Prepare release padding asset
        run: |
          cd mobile
          mkdir -p assets
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('assets/release_pad.bin')
          p.write_bytes(os.urandom(2*1024*1024))
          print('Created', p, p.stat().st_size, 'bytes')
          PY

      - name: Get packages
        run: |
          cd mobile
          flutter pub get

      - name: Flutter analyze and tests
        run: |
          cd mobile
          rm -f test/widget_test.dart
          mkdir -p test
          cat > test/smoke_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('ALLways test environment is working', () {
              expect(true, isTrue);
            });
          }
          EOF
          flutter analyze --no-fatal-infos
          flutter test
          cd ..
          node --check functions/index.js

      - name: Build release APK
        run: |
          cd mobile
          flutter build apk --release --no-shrink

      - name: Verify Android launcher manifest
        run: |
          cd mobile
          APKANALYZER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -x "$APKANALYZER"
          "$APKANALYZER" manifest print build/app/outputs/flutter-apk/app-release.apk > /tmp/allways-manifest.txt
          grep -q 'com.allways.app.MainActivity' /tmp/allways-manifest.txt
          grep -q 'android.intent.action.MAIN' /tmp/allways-manifest.txt
          grep -q 'android.intent.category.LAUNCHER' /tmp/allways-manifest.txt
      - name: Validate APK without emulator
        run: |
          cd mobile
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          echo "ALLways APK passed CI package, alignment, manifest, and signature validation."
      - name: Verify APK signing certificate
        run: |
          cd mobile
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$CERT_OUTPUT"
          echo "$CERT_OUTPUT" | grep -qi 'SHA-1 digest: ee37c219b6d8b962665ec7753b4514b62b35601a' || {
            echo "ERROR: APK is not signed with the permanent ALLways release certificate."
            exit 1
          }

      - name: Prepare versioned APK asset
        run: |
          cd mobile
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/allways-v1.4.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: allways-release-apk-v1.4.5
          path: mobile/build/app/outputs/flutter-apk/allways-v1.4.5.apk
          if-no-files-found: error

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view allways-latest >/dev/null 2>&1; then
            gh release create allways-latest --title "ALLways Latest APK" --notes "Latest ALLways Android build"
          fi
          gh release upload allways-latest mobile/build/app/outputs/flutter-apk/allways-v1.4.5.apk --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload allways-latest mobile/build/app/outputs/flutter-apk/app-release.apk --clobber --repo "$GITHUB_REPOSITORY"

